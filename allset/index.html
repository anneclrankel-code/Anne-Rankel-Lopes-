<style>

.cal{padding:14px 12px 10px}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-top b{font-size:16px;font-weight:800;text-transform:capitalize}
.cal-nav{width:40px;height:40px;border-radius:999px;background:var(--bg-2);font-size:22px;line-height:1;font-weight:700}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-sem,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-sem span{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0}
.cal-grid .c{position:relative;display:flex;justify-content:center;padding:2px 0}
.cal-grid .n{position:relative;z-index:1;width:100%;max-width:44px;aspect-ratio:1;border-radius:999px;font-weight:600;font-size:15px}
.cal-grid .n:disabled{color:var(--faint);opacity:.5;cursor:default}
.cal-grid .hoje .n{box-shadow:inset 0 0 0 1.5px var(--line)}
.cal-grid .entre{background:var(--pri-soft)}
.cal-grid .entre .n{color:var(--pri-text)}
.cal-grid .faixa-d{background:linear-gradient(90deg,transparent 50%,var(--pri-soft) 50%)}
.cal-grid .faixa-e{background:linear-gradient(90deg,var(--pri-soft) 50%,transparent 50%)}
.cal-grid .ini .n,.cal-grid .fim .n{background:linear-gradient(135deg,var(--pri),var(--pri-2));color:var(--pri-ink);font-weight:800;box-shadow:0 4px 12px rgba(14,138,126,.3)}
.cal-grid .entre,.cal-grid .faixa-d,.cal-grid .faixa-e{margin:2px 0;padding:0}
.cal-info{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 6px 0;font-size:14px;color:var(--muted)}
.cal-info b{color:var(--ink)}
.cal-info button{color:var(--pri-text);font-weight:700;padding:6px 10px;border-radius:999px;background:var(--bg-2);font-size:13px}
@media (hover:hover){.cal-grid .n:not(:disabled):hover{background:var(--bg-2)}.cal-grid .ini .n:hover,.cal-grid .fim .n:hover{background:linear-gradient(135deg,var(--pri),var(--pri-2))}}
.bloco{padding:16px 16px 6px;margin-bottom:22px}
.bloco-t{font-size:15px;font-weight:800;margin:0 0 12px}
.bloco-l{font-size:13px;font-weight:700;color:var(--muted);margin:12px 2px 8px}
.bloco .add{margin-bottom:0}
.bloco .add input{background:var(--field);box-shadow:none}
.bloco .hint{margin:10px 2px 8px}
.chips.rolar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.chips.rolar::-webkit-scrollbar{display:none}
.chips.rolar .chip{flex:none;white-space:nowrap}
.bloco .chip{box-shadow:none;background:var(--field)}
.bloco .chip.on{background:var(--pri);color:var(--pri-ink)}
.bloco-lista{margin-bottom:6px}
.lista-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 10px}
.lista-top .bloco-t{margin:0}
.lite{background:none;color:var(--pri-text);font-weight:700;font-size:14px;padding:6px 2px;white-space:nowrap}
.busca{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:0 8px 0 16px;margin-bottom:10px;border:1.5px solid transparent}
.busca:focus-within{border-color:var(--pri)}
.busca input{flex:1;min-width:0;border:0;background:none;padding:13px 0;font-size:16px;outline:none}
.busca input::-webkit-search-cancel-button{display:none}
.busca button{width:32px;height:32px;border-radius:999px;color:var(--muted);font-size:20px;background:var(--bg-2)}
.filtros{margin-bottom:8px}
.filtro-p .fchip{box-shadow:none;background:var(--bg-2);color:var(--muted);font-weight:700;font-size:13px;padding:7px 12px}
.filtro-p .fchip.on{background:var(--ink);color:var(--bg)}
.multi-tag{display:inline-block;background:var(--pri-soft);color:var(--pri-text);font-weight:800;font-size:12px;padding:5px 10px;border-radius:999px;margin-bottom:8px}
.type.multi{position:relative;padding-right:34px}
.tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:7px;border:2px solid var(--faint);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--pri-ink)}
.on > .tick{background:var(--pri);border-color:var(--pri)}
.on > .tick::after{content:"✓"}
.selecao{font-size:14px;color:var(--muted);margin:14px 4px 0}
.selecao b{color:var(--ink)}
.sub-linha{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.quem-casa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.pessoa{position:relative;display:flex;align-items:center;gap:10px;padding:14px 34px 14px 14px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;text-align:left;min-width:0}
.pessoa.on{border-color:var(--pri);background:var(--pri-soft)}
.pessoa .e{font-size:26px;flex:none}
.pessoa .pn{min-width:0}
.pessoa b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pessoa small{color:var(--muted);font-size:12px}
.dobra{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:10px;padding:0 14px}
.dobra summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.dobra summary::-webkit-details-marker{display:none}
.dobra[open] summary{border-bottom:1px solid var(--line-soft);margin-bottom:12px}
.dobra[open]{padding-bottom:12px}
.dobra .quem .pf{box-shadow:none;background:var(--field)}
.dobra .quem .pf.on{background:var(--pri-soft)}
.badge{background:var(--pri);color:var(--pri-ink);font-size:12px;padding:2px 8px;border-radius:999px}
.np input#npNome{width:100%;padding:14px 16px;border:1.5px solid transparent;border-radius:16px;background:var(--field);font-size:16px}
.np input#npNome:focus{outline:none;border-color:var(--pri)}
.np .chip{box-shadow:none;background:var(--field)}
.np .chip.on{background:var(--pri);color:var(--pri-ink)}
.btn2{display:block;width:100%;margin:14px 0 6px;padding:13px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800}
.pessoa-it .e{font-size:24px;width:32px;text-align:center}
.pessoa-it .nm b{display:block}
@media (max-width:370px){ .quem-casa{grid-template-columns:1fr} }
.loading{padding:80px 0;text-align:center;color:var(--muted)}
/* ---------- celular ---------- */
@media (max-width:440px){
  #app{padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right));padding-top:calc(14px + env(safe-area-inset-top))}
  h1{font-size:26px}
  .auth h1{font-size:28px}
  .q{font-size:24px}
  .hdr h2{font-size:19px}
  .hdr{gap:10px}
  .card{border-radius:20px}
  .list{border-radius:20px}
  .it{gap:8px;padding:10px 8px 10px 12px}
  .it .nm{font-size:15px}
  .qty button{width:32px;height:32px}
  .del{width:32px;height:32px}
  .para select,.add input,label input,.minput{font-size:16px}
  .add .go,.mic{width:50px;height:50px}
  .prog{padding:16px}
  .prog .big{font-size:26px}
  .type{padding:12px;gap:8px}
  .type .e{font-size:22px}
  .stat{padding:14px 10px}
  .stat b{font-size:24px}
  .rv{grid-template-columns:70px 1fr auto;gap:8px}
  .trip{padding:12px;gap:12px}
  .trip .ic{width:46px;height:46px;border-radius:16px;font-size:23px}
  .sub-h{padding-left:14px;padding-right:12px}
  .fab{padding:15px 24px}
}
@media (max-width:370px){
  .row2{grid-template-columns:1fr;gap:0}
  .types{grid-template-columns:1fr}
  .type small{font-size:12px}
  .tabs button{font-size:14px}
  .seg button{padding:8px 12px;font-size:13px}
  .stats{gap:8px}
  .stat b{font-size:21px}
  .stat span{font-size:11px}
  .trip .pc{padding:5px 8px;font-size:12px}
  .qty button{width:28px}
  .qty span{min-width:18px}
  .del{width:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function dias(inicio, fim){
  if(!inicio || !fim) return 3;
  const n = Math.round((new Date(fim+"T12:00") - new Date(inicio+"T12:00"))/864e5) + 1;
  return Math.max(1, Math.min(n, 60));

function toast(msg, desfazer){
  const t=document.getElementById("toast"); t.textContent=msg;
  if(desfazer){ const b=document.createElement("button"); b.textContent="Desfazer"; b.className="undo";
    b.onclick=()=>{ desfazer(); t.classList.remove("show"); }; t.appendChild(b); }
  t.classList.toggle("tem-acao", !!desfazer); t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"), desfazer?6000:2600);
}
function catalogo(){ // nome normalizado -> categoria, a partir da base de modelos

  [...Object.values(perfis),...Object.values(modelos),...Object.values(climas)].forEach(md => (md.itens||[]).forEach(i => m[norm(i.nome)] = i.categoria));

}

// O que cada perfil levou nas últimas viagens (até 3), marcado como levado
function memoriaPorPerfil(){
  const ult = Object.values(trips).filter(t=>(t.itens||[]).some(i=>i.levado))
    .sort((a,b)=>(b.inicio||b.criadaEm||"").localeCompare(a.inicio||a.criadaEm||"")).slice(0,3);
  const mem={};
  ult.forEach(t=>{ const vm=Object.fromEntries((t.viajantes||[]).map(v=>[v.id,v]));
    t.itens.forEach(i=>{ if(!i.levado) return; const v=vm[i.quem];
      const chaves = v ? [v.perfil].concat(v.pessoaId?["p:"+v.pessoaId]:[]) : ["geral"];
      chaves.forEach(pf=>{ mem[pf]=mem[pf]||new Map();
        const k=norm(i.nome); if(!mem[pf].has(k)) mem[pf].set(k,{nome:i.nome,categoria:i.categoria,qtd:i.qtd}); }); }); });
  return mem;
}
const temHistorico = () => Object.values(trips).some(t=>(t.itens||[]).some(i=>i.levado));
// Combina as camadas: perfis (quem vai) + clima + tipo de viagem + histórico
function gerarItens(o){
  const nDias=o.dias, viajantes=o.viajantes||[], modo=o.modo||"geral";
  const out = new Map();
  const put = (i, quem, origem, qtdFixa) => {
    const q = qtdFixa || qtdRegra(i,nDias); const k = quem+"|"+norm(i.nome);
    if(out.has(k)){ out.get(k).qtd = Math.max(out.get(k).qtd, q); return; }
    out.set(k,{ id:uid(), nome:i.nome, categoria:i.categoria||"Outros", qtd:q, levado:false, origem, quem });
  };
  const camadas = [
    ...modelosOrdenados().filter(([id,md])=>md.sempre || o.tipos.includes(id)).map(([id,md])=>[id,md]),
    ...climasOrdenados().filter(([id])=>o.clima.includes(id)).map(([id,md])=>["clima:"+id,md])
  ];
  const usarGeral = modo!=="historico", usarHist = modo!=="geral";
  const mem = usarHist ? memoriaPorPerfil() : {}; const rg = usarHist ? regras() : {};
  const daMemoria = (pf, quem) => { const m=mem[pf]; if(!m||!m.size) return false;
    m.forEach((i,k)=>{ const r=rg[k]; put(i, quem, "historico", r ? qtdRegra(r,nDias) : (i.qtd||1)); }); return true; };
  // grupo
  const geralHist = usarHist && daMemoria("geral","geral");
  camadas.forEach(([id,md]) => (md.itens||[]).forEach(i=>{
    if(i.porPessoa||i.pet) return;
    if(usarGeral || !geralHist || id.startsWith("clima:") || !md.sempre || i.categoria==="Antes de sair") put(i,"geral",id);
  }));
  // cada viajante
  viajantes.forEach(v=>{
    const p = perfis[v.perfil]; if(!p) return;
    const veioHist = usarHist && ((v.pessoaId && daMemoria("p:"+v.pessoaId, v.id)) || daMemoria(v.perfil, v.id));
    if(usarGeral || !veioHist) (p.itens||[]).forEach(i=>put(i, v.id, "perfil:"+v.perfil));
    camadas.forEach(([id,md]) => (md.itens||[]).forEach(i=>{
      if(p.humano && i.porPessoa && (!i.soAdulto || p.adulto) && (!i.soCrianca || !p.adulto)) put(i, v.id, id);
      if(!p.humano && i.pet) put(i, v.id, id);
    }));
  });
  return [...out.values()];
}
const opcoesForm = () => { const f=state.form; return {dias:dias(f.inicio,f.fim), tipos:f.tipos, clima:f.clima, modo:f.modo||"geral", viajantes:viajantesDoForm()}; };
function viajantesDoForm(){

function historico(excluir){
  const lista = Object.entries(trips).filter(([id])=>id!==excluir).map(([,t])=>t);
  const m = new Map();
  lista.forEach(t => (t.itens||[]).forEach(i=>{
    const k=norm(i.nome);
    if(!m.has(k)) m.set(k,{nome:i.nome,categoria:i.categoria,levado:0,listado:0,manual:false});
    const r=m.get(k); r.listado++; if(i.levado) r.levado++; if(i.origem==="manual") r.manual=true;
  }));
  return { total: lista.length, itens:[...m.values()] };
}
function sugestoesHistorico(listaAtual){
  const ja = new Set(listaAtual.map(i=>norm(i.nome)));
  return historico().itens.filter(i=>i.levado>0 && !ja.has(norm(i.nome)))
    .sort((a,b)=>b.levado-a.levado).slice(0,10);
}

function salvar(id){
  if(state.mode!=="db"){ salvarLocal(); return; }
  dirty.add(id); versions[id]=(versions[id]||0)+1; const v=versions[id];
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{
    const t = trips[id]; if(!t) return;
    const body = clone(t);
    chains[id]=(chains[id]||Promise.resolve()).then(()=>db.collection("viagens").doc(id).set(body))
      .then(()=>{ if(versions[id]===v) dirty.delete(id); })
      .catch(e=>{ dirty.delete(id); erroEscrita(e); });
  },400);
}
function apagar(id){
  delete trips[id]; deleted.add(id); dirty.delete(id); clearTimeout(timers[id]);
  if(state.mode!=="db"){ salvarLocal(); return; }
  (chains[id]||Promise.resolve()).then(()=>db.collection("viagens").doc(id).delete()).catch(erroEscrita);
}
function erroEscrita(e){

  else if(c==="quota_exceeded") toast("A base de dados está cheia. Apague viagens antigas.");

}

const NUMS={um:1,uma:1,dois:2,duas:2,"tres":3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10};
// ---------- comandos (voz ou texto) ----------
// "peguei o carregador", "marcar protetor e chinelo" -> marca como levado
// "desmarcar toalha" -> volta para "faltam"; qualquer outra frase -> adiciona itens
const RX_MARCAR = /^(j[aá]\s+)?(marc\w*|conclu\w*|peguei|coloquei|guardei|separei|botei|levei|check|feito|ok)\s+/i;
const RX_DESMARCAR = /^(desmarc\w*|tirar? (o )?check|n[aã]o peguei|faltou|falta)\s+/i;
const STOP = new Set(["de","do","da","dos","das","o","a","os","as","um","uma","uns","umas","meu","minha","meus","minhas","para","pra","com","no","na","nos","nas","ja","tambem"]);
const raiz = w => w.length>4 && /[rzs]es$/.test(w) ? w.slice(0,-2) : w.length>3 && w.endsWith("s") ? w.slice(0,-1) : w;
const palavras = s => norm(s).split(/[^a-z0-9]+/).filter(w=>w && !STOP.has(w)).map(raiz);
function procurarItens(t, frase){
  const alvo = norm(frase), pw = palavras(frase); if(!pw.length) return [];
  let cand = t.itens;
  const fp = state.filtroPessoa, vids=(t.viajantes||[]).map(v=>v.id);
  if(fp!=="todas" && (fp==="geral"||vids.includes(fp))) cand = cand.filter(i=>(vids.includes(i.quem)?i.quem:"geral")===fp);
  const exato = cand.filter(i=>norm(i.nome)===alvo || palavras(i.nome).join(" ")===pw.join(" "));
  if(exato.length) return exato;
  return cand.filter(i=>{ const iw=new Set(palavras(i.nome)); return pw.every(w=>iw.has(w) || [...iw].some(x=>x.startsWith(w)&&w.length>=4)); });
}
function processarComando(texto, voz){
  const t=trips[state.tripId]; if(!t||!texto||!texto.trim()) return;
  const pre = voz ? "🎤 " : "";
  let s = texto.trim().replace(/[.!?]+$/,"");
  const desm = RX_DESMARCAR.test(s), marc = !desm && RX_MARCAR.test(s);
  if(!desm && !marc){ const add=adicionarTexto(s); if(add.length) toast(pre+"Adicionado: "+add.join(", ")); return; }
  s = s.replace(desm?RX_DESMARCAR:RX_MARCAR,"").replace(/\s+(na|da)\s+(lista|mala)$/i,"").replace(/^como (levado|feito)\s+/i,"");
  const partes = s.split(/\s*,\s*|\s+e\s+|\s*;\s*/i).map(p=>p.trim()).filter(Boolean);
  const mudou=[], naoAchou=[];
  const vmap = Object.fromEntries((t.viajantes||[]).map(v=>[v.id,v.nome]));
  partes.forEach(p=>{
    const achados = procurarItens(t,p).filter(i=>i.levado===desm);
    if(!achados.length){ naoAchou.push(p.replace(/^(o|a|os|as|um|uma|meu|minha|meus|minhas)\s+/i,"")); return; }
    achados.forEach(i=>{ mudou.push({id:i.id, antes:i.levado, nome:i.nome+(vmap[i.quem]&&achados.length>1?" ("+vmap[i.quem]+")":"")}); i.levado=!desm; });
  });
  if(mudou.length){
    salvar(state.tripId); render();
    const tid=state.tripId;
    toast(pre+(desm?"Desmarcado: ":"✓ Na mala: ")+mudou.map(m=>m.nome).join(", ")+(naoAchou.length?` · Não achei: ${naoAchou.join(", ")}`:""), ()=>{
      const tt=trips[tid]; if(!tt) return; mudou.forEach(m=>{ const i=tt.itens.find(x=>x.id===m.id); if(i) i.levado=m.antes; }); salvar(tid); render(); });
  } else toast(pre+`Não achei na lista: ${naoAchou.join(", ")}`);
}
function adicionarTexto(texto){
  const t=trips[state.tripId]; if(!t||!texto) return [];
  let s = texto.trim().replace(/[.!?]+$/,"");
  s = s.replace(/^(por favor[, ]*)?(adicion\w*|coloc\w*|inclu\w*|p[oô]e|bota|levar|leva|preciso (de )?levar)\s+/i,"");
  s = s.replace(/\s+(na|à|a)\s+(lista|mala)$/i,"");
  const partes = s.split(/\s*,\s*|\s+e\s+|\s*;\s*/i).map(p=>p.trim()).filter(Boolean);
  const cat = catalogo(); const add=[];
  partes.forEach(p=>{
    let qtd=1; const m=p.match(/^(\d+|\S+)\s+(.+)$/);
    if(m){ const w=norm(m[1]); if(/^\d+$/.test(w)){qtd=Math.min(99,+w);p=m[2];} else if(NUMS[w]){qtd=NUMS[w];p=m[2];} }
    p=p.charAt(0).toUpperCase()+p.slice(1);
    const quem = (state.addPara==="geral" || (t.viajantes||[]).some(v=>v.id===state.addPara)) ? state.addPara : "geral";
    const ex=t.itens.find(i=>norm(i.nome)===norm(p) && (i.quem||"geral")===quem);
    if(ex){ ex.qtd = Math.max(ex.qtd, qtd); ex.levado=false; add.push(p); return; }
    const h=historico(state.tripId).itens.find(x=>norm(x.nome)===norm(p));
    t.itens.push({id:uid(),nome:p,categoria:cat[norm(p)]||(h&&h.categoria)||"Outros",qtd,levado:false,origem:"manual",quem});
    add.push(p);
  });
  if(add.length){ salvar(state.tripId); render(); }
  return add;
}

const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function dataLonga(s){ if(!s) return ""; const [y,m,d]=s.split("-").map(Number); const dt=new Date(y,m-1,d);
  return `${SEM_CURTA[dt.getDay()]}, ${d} ${MESES[m-1].slice(0,3)}`; }
function calendarioHTML(){
  const f=state.form, h0=hoje();
  const [y,m]=f.calMes.split("-").map(Number); const mi=m-1;
  const primeiro=new Date(y,mi,1).getDay(), total=new Date(y,mi+1,0).getDate();
  const podeVoltar = f.calMes > h0.slice(0,7);
  const n = dias(f.inicio,f.fim);
  let cells="";
  for(let i=0;i<primeiro;i++) cells+=`<div class="c"></div>`;
  for(let d=1; d<=total; d++){
    const s=ymd(y,mi,d), passado = s<h0;
    const ini = s===f.inicio, fim = s===f.fim, entre = f.inicio&&f.fim && s>f.inicio && s<f.fim;
    const cls = [ini&&"ini", fim&&"fim", entre&&"entre", (ini&&f.fim&&f.fim!==f.inicio)&&"faixa-d", (fim&&f.inicio!==f.fim)&&"faixa-e", s===h0&&"hoje"].filter(Boolean).join(" ");

  }

  const esperandoVolta = f.inicio && !f.fim;
  return `<div class="cal-resumo">${resumo("Ida",f.inicio,!f.inicio)}<span class="cal-seta">→</span>${resumo("Volta",f.fim,esperandoVolta)}</div>
    <div class="card cal">
      <div class="cal-top"><button type="button" class="cal-nav" data-act="mes" data-delta="-1" ${podeVoltar?"":"disabled"} aria-label="Mês anterior">‹</button>

      <div class="cal-sem">${["D","S","T","Q","Q","S","S"].map(x=>`<span>${x}</span>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="cal-info"><span>${f.inicio&&f.fim ? `<b>${n} ${n===1?"dia":"dias"}</b> · ${n-1} ${n-1===1?"noite":"noites"}` : esperandoVolta ? "Agora toque na data de volta." : "Sem as datas, considero 3 dias."}</span>

}

const ICON_G = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.4-1 7.2-2.7l-3.5-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.2v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.8 14.2a6.6 6.6 0 0 1 0-4.4V7H2.2a11 11 0 0 0 0 10z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.2 7l3.6 2.8C6.7 7.3 9.1 5.4 12 5.4z"/></svg>`;
function authView(){
  const A=state.auth;
  const topo = `<div class="auth-top">${botaoTema()}</div>`;
  const aviso = `<p class="demo-note">🔒 Modo demonstração: nenhuma senha é salva ou enviada.</p>`;
  if(sessao && !sessao.nome){
    return `${topo}<div class="auth">${LOGO}<h1>Boas-vindas! 👋</h1><p class="sub">Como podemos te chamar?</p>
      <form id="fNome" autocomplete="off"><label>Seu nome<input name="nome" value="${esc(A.nome)}" placeholder="Ex.: Ana" maxlength="40"></label>
      ${A.erro?`<p class="erro">${esc(A.erro)}</p>`:""}<button type="submit" class="primary">Começar</button></form></div>`;
  }
  const google = `<button type="button" class="google" data-act="google" ${A.carregando?"disabled":""}>${A.carregando?'<span class="spin"></span> Conectando…':ICON_G+" Continuar com Google"}</button>
    <div class="ou"><span>ou</span></div>`;
  if(A.tela==="cadastro"){
    return `${topo}<div class="auth">${LOGO}<p class="eyebrow">AllSet</p><h1>Criar conta</h1><p class="sub">Organize as malas da família sem esquecer nada.</p>${google}
      <form id="fCad" autocomplete="off" novalidate>
        <label>Nome<input name="nome" value="${esc(A.nome)}" placeholder="Seu nome" maxlength="40"></label>
        <label>E-mail<input name="email" type="email" value="${esc(A.email)}" placeholder="voce@email.com"></label>
        <label>Senha<input name="senha" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password"></label>
        <label class="check"><input type="checkbox" name="termos"> <span>Li e aceito os termos de uso e a política de privacidade</span></label>
        ${A.erro?`<p class="erro">${esc(A.erro)}</p>`:""}
        <button type="submit" class="primary">Criar conta</button></form>
      <p class="troca">Já tem conta? <button data-act="authTela" data-t="login">Entrar</button></p>${aviso}</div>`;
  }
  return `${topo}<div class="auth">${LOGO}<p class="eyebrow">AllSet · Viagens</p><h1>Sua mala pronta,<br>sem esquecer nada.</h1>
    <p class="sub">Listas de viagem sugeridas para cada pessoa da casa, pelo clima e pelo destino.</p>${google}
    <form id="fLogin" autocomplete="off" novalidate>
      <label>E-mail<input name="email" type="email" value="${esc(A.email)}" placeholder="voce@email.com"></label>
      <label>Senha<input name="senha" type="password" placeholder="Sua senha" autocomplete="current-password"></label>
      <div class="esq"><button type="button" data-act="esqueci">Esqueci minha senha</button></div>
      ${A.erro?`<p class="erro">${esc(A.erro)}</p>`:""}
      <button type="submit" class="primary">Entrar</button></form>
    <p class="troca">Ainda não tem conta? <button data-act="authTela" data-t="cadastro">Criar conta</button></p>${aviso}</div>`;
}
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const nomeDoEmail = e => { const n=(e.split("@")[0]||"").replace(/[._-]+/g," ").replace(/\d+/g,"").trim(); return n ? n.charAt(0).toUpperCase()+n.slice(1) : ""; };
function entrar(dados){ sessao=dados; salvarSessao(); state.auth={tela:"login",nome:"",email:"",erro:"",carregando:false}; state.view="home"; render(); window.scrollTo(0,0);
  if(sessao.nome) toast("Olá, "+sessao.nome.split(" ")[0]+"! 👋"); }
function iniciais(n){ const p=(n||"?").trim().split(/\s+/); return ((p[0]||"")[0]||"?").toUpperCase()+((p[1]||"")[0]||"").toUpperCase(); }
function renderSeguro(){
  const ae=document.activeElement;
  if(ae && ae.tagName==="INPUT" && !["busca","addInput","npNome"].includes(ae.id) && document.getElementById("app").contains(ae)){ pendingRender=true; return; }
  render();
}
setInterval(()=>{ if(pendingRender){ const ae=document.activeElement; if(!(ae&&ae.tagName==="INPUT")) render(); } },1200);

// ---------- eventos ----------
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.act==="cancel" && e.target.closest("[data-stop]") && !e.target.closest("button")) return;
  const act=el.dataset.act, id=el.dataset.id; const t=trips[state.tripId];
  switch(act){
    case "tema": { const n=temaAtual()==="dark"?"light":"dark"; document.documentElement.dataset.theme=n; try{localStorage.setItem("tema",n);}catch(e){} render(); break; }
    case "google": if(state.auth.carregando) break; state.auth.carregando=true; state.auth.erro=""; render();
      setTimeout(()=>{ state.auth.carregando=false; entrar({nome:"", email:"", via:"google"}); }, 1200); break;
    case "authTela": state.auth.tela=el.dataset.t; state.auth.erro=""; render(); break;
    case "esqueci": toast(state.auth.email&&emailOk(state.auth.email) ? "Enviamos um link de recuperação para "+state.auth.email+" (demonstração)" : "Digite seu e-mail acima para recuperar a senha"); break;
    case "conta": state.confirm={titulo:sessao.nome, msg:(sessao.email||(sessao.via==="google"?"Conectado com Google":""))+" · Modo demonstração", ok:"Sair", fn:()=>{ sessao=null; salvarSessao(); state.view="home"; }}; render(); break;
    case "tab": state.tab=el.dataset.tab; render(); break;
    case "nova": state.view="nova"; state.form=novoForm(); render(); window.scrollTo(0,0); break;
    case "home": state.view="home"; render(); window.scrollTo(0,0); break;
    case "abrir": state.view="viagem"; state.tripId=id; state.filtro="todos"; state.busca=""; state.filtroPessoa="todas"; state.addPara="geral"; render(); window.scrollTo(0,0); break;
    case "tipo": { const s=state.form.tipos; const i=s.indexOf(id); i>=0?s.splice(i,1):s.push(id); render(); break; }
    case "dia": escolherDia(el.dataset.d); break;
    case "mes": { const [y,m]=state.form.calMes.split("-").map(Number); const d=new Date(y,m-1+ +el.dataset.delta,1);
      state.form.calMes=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); render(); break; }
    case "limparDatas": state.form.inicio=""; state.form.fim=""; render(); break;
    case "para": state.addPara=id; render(); break;
    case "filtroPessoa": state.filtroPessoa=id; render(); break;
    case "limparBusca": state.busca=""; render(); { const b=document.getElementById("busca"); b&&b.focus(); } break;
    case "npPerfil": state.novaPessoa.perfil=id; render(); { const i=document.getElementById("npNome"); if(i&&!state.novaPessoa.nome) i.focus(); } break;
    case "addPessoa": if(adicionarPessoa()) render(); break;
    case "addPessoaW": { const p=adicionarPessoa(); if(p){ state.form.pessoas.push(p.id); render(); } break; }
    case "pessoaW": { const s=state.form.pessoas; const i=s.indexOf(id); i>=0?s.splice(i,1):s.push(id); render(); break; }
    case "todosCasa": state.form.pessoas = state.form.pessoas.length===casa.length ? [] : casa.map(p=>p.id); render(); break;
    case "renomearPessoa": { const p=casa.find(x=>x.id===id); if(!p) break;
      state.confirm={titulo:"Renomear",msg:"",input:p.nome,ok:"Salvar",fn:val=>{ val=(val||"").trim(); if(val){ p.nome=val.slice(0,40); salvarCasa(); } }};
      render(); setTimeout(()=>{ const i=document.getElementById("modalInput"); if(i){ i.focus(); i.select(); } },30); break; }
    case "removerPessoa": { const p=casa.find(x=>x.id===id); if(!p) break;
      state.confirm={titulo:"Remover "+p.nome+"?",msg:"Sai do cadastro da casa. As viagens já criadas continuam iguais.",ok:"Remover",fn:()=>{ casa=casa.filter(x=>x.id!==id); salvarCasa(); }}; render(); break; }
    case "clima": { const s=state.form.clima; const i=s.indexOf(id); i>=0?s.splice(i,1):s.push(id); render(); break; }
    case "modo": state.form.modo=id; render(); break;
    case "voltarPasso": state.form.passo=Math.max(0,state.form.passo-1); render(); window.scrollTo(0,0); break;
    case "irPasso": state.form.passo=+el.dataset.p; render(); window.scrollTo(0,0); break;
    case "quem": { const q=state.form.quem; q[id]=Math.max(0,Math.min(9,(q[id]||0)+ +el.dataset.d)); render(); break; }
    case "colapsar": { const k=el.dataset.k, completo=el.dataset.c==="1";
      if(estaFechado(k,completo)){ colapsados.delete(k); if(completo) abertos.add(k); } else { colapsados.add(k); abertos.delete(k); }
      render(); break; }
    case "agrupar": state.agrupar = state.agrupar==="pessoa"?"categoria":"pessoa"; render(); break;
    case "renomear": { const v=(t&&t.viajantes||[]).find(x=>x.id===id); if(!v) break;
      state.confirm={titulo:"Nome do viajante",msg:"",input:v.nome,ok:"Salvar",fn:val=>{ val=(val||"").trim(); if(val){ v.nome=val.slice(0,40); salvar(state.tripId); } }};
      render(); setTimeout(()=>{ const i=document.getElementById("modalInput"); if(i){ i.focus(); i.select(); } },30); break; } { const s=state.form.hist, n=el.dataset.nome; const i=s.indexOf(n); i>=0?s.splice(i,1):s.push(n); render(); break; }
    case "filtro": state.filtro=el.dataset.f; render(); break;
    case "toggle": if(state.readonly||!t) break; { const it=t.itens.find(x=>x.id===id); if(it){ it.levado=!it.levado;
      if(it.levado) [...abertos].forEach(k=>{ if(k.startsWith(state.tripId+"|") && k.endsWith("|"+it.categoria)) abertos.delete(k); });
      salvar(state.tripId); render(); } } break;
    case "qty": if(!t) break; { const it=t.itens.find(x=>x.id===id); if(it){ it.qtd=Math.max(1,Math.min(99,it.qtd+ +el.dataset.d)); salvar(state.tripId); render(); } } break;
    case "del": if(!t) break; { const it=t.itens.find(x=>x.id===id); t.itens=t.itens.filter(x=>x.id!==id); salvar(state.tripId); render(); if(it) toast("Removido: "+it.nome); } break;
    case "excluir": state.confirm={titulo:"Excluir viagem?",msg:"A lista e o histórico desta viagem serão apagados.",ok:"Excluir",fn:()=>{ apagar(state.tripId); state.view="home"; toast("Viagem excluída"); }}; render(); break;
    case "okconfirm": { const mi=document.getElementById("modalInput"); const val=mi?mi.value:undefined; const fn=state.confirm&&state.confirm.fn; state.confirm=null; fn&&fn(val); render(); break; }
    case "cancel": state.confirm=null; render(); break;
    case "mic": micClick(); break;
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="busca"){ state.busca=e.target.value; render(); return; }
  if(e.target.id==="addInput"){ state.addTxt=e.target.value; return; }
  if(e.target.id==="npNome"){ state.novaPessoa.nome=e.target.value; return; }
  if(e.target.closest("#fLogin,#fCad,#fNome") && (e.target.name==="email"||e.target.name==="nome")) state.auth[e.target.name]=e.target.value;
  const f=e.target.closest("#fNova"); if(!f) return;
  state.form[e.target.name]=e.target.value;
  atualizarBotaoPasso();
});
document.addEventListener("change", e=>{ if(e.target.id==="addPara") state.addPara=e.target.value; });
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="npNome"){ e.preventDefault(); const b=document.querySelector('[data-act="addPessoa"],[data-act="addPessoaW"]'); b&&b.click(); } });
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="modalInput"){ e.preventDefault(); const b=document.querySelector('[data-act="okconfirm"]'); b&&b.click(); } });
document.addEventListener("submit", e=>{
  e.preventDefault();
  const A=state.auth, fd = n => (e.target.elements[n]||{}).value || "";
  if(e.target.id==="fLogin"){
    const email=fd("email").trim(), senha=fd("senha");
    if(!emailOk(email)) A.erro="Digite um e-mail válido.";
    else if(senha.length<6) A.erro="A senha precisa ter pelo menos 6 caracteres.";
    else { entrar({nome:nomeDoEmail(email), email, via:"email"}); return; }
    render(); return;
  }
  if(e.target.id==="fCad"){
    const nome=fd("nome").trim(), email=fd("email").trim(), senha=fd("senha"), termos=e.target.elements.termos.checked;
    if(!nome) A.erro="Conte seu nome.";
    else if(!emailOk(email)) A.erro="Digite um e-mail válido.";
    else if(senha.length<6) A.erro="A senha precisa ter pelo menos 6 caracteres.";
    else if(!termos) A.erro="Para continuar, aceite os termos de uso.";
    else { entrar({nome, email, via:"email"}); return; }
    render(); return;
  }
  if(e.target.id==="fNome"){
    const nome=fd("nome").trim(); if(!nome){ A.erro="Conte seu nome."; render(); return; }
    entrar({...sessao, nome}); return;
  }
  if(e.target.id==="fNova"){
    if(PASSOS[state.form.passo]==="revisao"){ if(!state.readonly) criarViagem(); return; }
    if(PASSOS[state.form.passo]==="quem" && !Object.values(state.form.quem).some(Boolean) && !state.form.pessoas.length) return;
    if(PASSOS[state.form.passo]==="datas" && state.form.inicio && !state.form.fim) return;
    state.form.passo++; render(); window.scrollTo(0,0);
    const first=document.querySelector("#fNova input"); if(first && PASSOS[state.form.passo]==="destino") first.focus();
  }
  if(e.target.id==="fAdd"){
    const inp=document.getElementById("addInput"); const v=inp.value; inp.value=""; state.addTxt="";
    processarComando(v,false);
    const ni=document.getElementById("addInput"); ni&&ni.focus();
  }
});

// ---------- voz ----------
function micClick(){
  if(!dict) return;
  if(listening){ dict.stop().catch(()=>{}); return; }
  dict.start().catch(err=>{
    const c=(err&&(err.code||err.reason||err.message))||String(err);
    if(String(c).includes("not_granted")){ dictDenied=true; toast("Sem permissão para o microfone. Você pode digitar normalmente."); render(); }
    else toast("Não consegui iniciar o microfone agora.");
  });
}
function ligarVoz(){
  if(!dict) return;
  dict.onPartial(({text})=>{ const i=document.getElementById("addInput"); if(i) i.value=text||""; });
  dict.onFinal(({text})=>{
    const i=document.getElementById("addInput"); if(i) i.value="";
    if(state.view!=="viagem") return;
    processarComando(text||"",true);
  });
  dict.onState(({state:s})=>{
    listening = s==="listening";
    const m=document.getElementById("mic"), h=document.getElementById("hint");
    if(m) m.classList.toggle("live",listening);
    if(h){ h.classList.toggle("live",listening);
      h.textContent = listening?"Ouvindo… ex.: “protetor solar e chinelo” ou “peguei o carregador”":"🎤 Diga os itens para incluir, ou “peguei…” para marcar como levado."; }
  });
}

// ---------- início ----------
const use = n => (window.claude && typeof window.claude.use==="function") ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
function modoDemo(){
  try{ casa=JSON.parse(localStorage.getItem("casa-demo")||"[]")||[]; }catch(e){ casa=[]; }
  // Na versão independente, a primeira visita já vem com uma família de exemplo (pode editar na aba Casa)
  try{ if(STANDALONE && localStorage.getItem("casa-demo")===null){
    casa=[{id:"pa",nome:"Anne",perfil:"mulher"},{id:"pm",nome:"Marcus",perfil:"homem"},{id:"pd",nome:"Davi",perfil:"crianca"},{id:"pt",nome:"Thor",perfil:"cachorro"}];
    localStorage.setItem("casa-demo",JSON.stringify(casa)); } }catch(e){}
  state.mode="demo"; modelos=clone(SEED_DEMO.modelos); perfis=clone(SEED_DEMO.perfis); climas=clone(SEED_DEMO.climas); trips=lerLocal(); state.loading=false; render();
}
(async function init(){
  render();
  if(!(window.claude && window.claude.use)){ modoDemo(); return; }
  const [d,u,dc] = await Promise.all([use("db"),use("user"),VOZ?use("dictation"):Promise.resolve(null)]);
  user=u; dict=dc; ligarVoz();
  if(!d){ modoDemo(); return; }
  db=d;
  try{ if(user && user.can){ const w=await user.can("data.write"); if(w===false) state.readonly=true; } }catch(e){}
  let got={m:false,v:false,p:false,c:false}, fresh={m:false,v:false,p:false,c:false};
  const todos = o => o.m&&o.v&&o.p&&o.c;
  const timer=setTimeout(()=>{ if(!todos(fresh)){ state.slowNote=true; state.loading=false; renderSeguro(); } },10000);
  const pronto=()=>{ if(todos(got) && state.loading){ state.loading=false; render(); } else renderSeguro();
    if(todos(fresh)){ clearTimeout(timer); if(state.slowNote){ state.slowNote=false; renderSeguro(); } } };
  const falha=e=>{ clearTimeout(timer); state.loading=false; state.slowNote=true; renderSeguro(); };
  db.collection("modelos").onSnapshot(s=>{
    const m={}; s.docs.forEach(doc=>{ m[doc.id]=doc.data(); }); modelos=m;
    got.m=true; if(!s.metadata.fromCache) fresh.m=true; pronto();
  }, falha);
  db.doc("casa/pessoas").onSnapshot(s=>{
    const d=s.exists?s.data():null; casa = d&&Array.isArray(d.pessoas) ? clone(d.pessoas) : []; renderSeguro();
  }, ()=>{});
  db.collection("climas").onSnapshot(s=>{
    const m={}; s.docs.forEach(doc=>{ m[doc.id]=doc.data(); }); climas=m;
    got.c=true; if(!s.metadata.fromCache) fresh.c=true; pronto();
  }, falha);
  db.collection("perfis").onSnapshot(s=>{
    const m={}; s.docs.forEach(doc=>{ m[doc.id]=doc.data(); }); perfis=m;
    got.p=true; if(!s.metadata.fromCache) fresh.p=true; pronto();
  }, falha);
  db.collection("viagens").onSnapshot(s=>{
    const nt={};
    s.docs.forEach(doc=>{ if(deleted.has(doc.id)) return; if(dirty.has(doc.id)&&trips[doc.id]){ nt[doc.id]=trips[doc.id]; return; } const x=clone(doc.data()); x.itens=Array.isArray(x.itens)?x.itens:[]; nt[doc.id]=x; });
    dirty.forEach(id=>{ if(!nt[id] && trips[id]) nt[id]=trips[id]; });
    trips=nt;
    got.v=true; if(!s.metadata.fromCache) fresh.v=true; pronto();
  }, falha);
})();
</script>
